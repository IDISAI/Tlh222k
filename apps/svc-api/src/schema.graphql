enum NodeType {
  role
  skill
  chapter
  article
}

enum ArticleType {
  notion
  jupyter
}

enum NodeStatus {
  locked
  in_progress
  done
}

"""
Whether a piece of content is shown, hidden, or merely unlisted. The same three
states for every kind of content. There is no review state and no archive:
nothing in this system approves content, so a state meaning "awaiting approval"
would name an act nobody performs.

Named `publishStatus` on each type because a block's `status` already means the
viewer's own progress through it.
"""
enum PublishStatus {
  DRAFT
  PUBLISHED
  PRIVATE
}

"""
How demanding a roadmap block is. Editorial: chosen by whoever edits the block,
never counted from its size. Absent means nobody has judged it yet.
"""
enum Level {
  BASIC
  INTERMEDIATE
  ADVANCED
}

enum Visibility {
  FREE
  INTERNAL
}

enum Discoverability {
  PUBLIC
  PRIVATE
}

enum CompositionScope {
  DRAFT
  PUBLISHED
}

enum EdgeKind {
  solid
  dashed
}

type CompositionMember {
  nodeId: ID!
  x: Float!
  y: Float!
  isRequired: Boolean!
}

type CompositionEdge {
  id: ID!
  sourceId: ID!
  targetId: ID!
  kind: EdgeKind!
}

type Composition {
  ownerId: ID!
  members: [CompositionMember!]!
  edges: [CompositionEdge!]!
}

type Roadmap {
  id: ID!
  slug: String!
  title: String!
  description: String
  thumbnailUrl: String
  publishStatus: PublishStatus!
  discoverability: Discoverability!
  visibility: Visibility!
  ownerId: ID
  roleTags: [String!]!
  dueDate: String
  firstPublishedAt: String
  archivedAt: String
  nodeCount: Int!
  """Distinct learners who started content inside this roadmap. Never page views."""
  learnerCount: Int!
  createdAt: String
  updatedAt: String
}

type RoadmapNode {
  id: ID!
  roadmapId: ID!
  parentId: ID
  title: String!
  slug: String!
  description: String
  nodeType: NodeType!
  notionPageId: String
  articleType: ArticleType
  jupyterUrl: String
  positionX: Float!
  positionY: Float!
  order: Int!
  status: NodeStatus!
  isDeleted: Boolean!
  childrenCount: Int!
  linkedRoadmapId: ID
  publishStatus: PublishStatus!
  """The image standing in for this block wherever it is shown as a card."""
  coverUrl: String
  level: Level
  visibility: Visibility!
  """Editorial free-text tags, narrower than a Field — used by the roadmap picker's tag filter."""
  tags: [String!]!
  """
  Distinct learners who started anything in this block's subtree. Never page
  views. Only `publicBlocks` computes it; other queries report 0.
  """
  learnerCount: Int!
  """Clerk id of whoever created this block. Stamped server-side on create; never a mutation input."""
  authorId: ID
  """
  Discovery labels this block carries. Many-to-many: a "Data Engineer" role
  can sit under both AI and Data, so it surfaces under either tab.
  """
  fields: [Field!]!
  """
  When the block was created. Not the same as first publish — blocks have no
  publish timestamp yet, so discovery sorts on this and says "Mới nhất".
  """
  createdAt: String
  """Last edit time. The public card selects it, so it must resolve."""
  updatedAt: String
}

"""
A discovery label ("Web Dev", "AI") rendered as a tab on /roadmaps. NOT a
hierarchy level — a Field owns no canvas and is never navigable.
"""
type Field {
  id: ID!
  title: String!
  slug: String!
  order: Int!
  description: String
  imageUrl: String
  publishStatus: PublishStatus!
}

type RoadmapGraph {
  roadmap: Roadmap!
  nodes: [RoadmapNode!]!
}

type RoadmapProgress {
  roadmapId: ID!
  roadmapTitle: String!
  doneCount: Int!
  totalCount: Int!
}

type NotionDoc {
  id: ID!
  slug: String
  title: String!
  isArchived: Boolean!
  parentDocumentId: ID
  content: String
  coverImage: String
  icon: String
  isPublished: Boolean!
  position: Int!
  createdAt: String!
  updatedAt: String!
}

type Query {
  roadmaps(includeUnpublished: Boolean = false): [Roadmap!]!
  roadmap(slug: String!): Roadmap
  roadmapGraph(slug: String!): RoadmapGraph
  roadmapGraphById(id: ID!): RoadmapGraph
  allNodes: [RoadmapNode!]!
  """CMS-only ordered memberships for one Field Workspace."""
  fieldNodeIds(fieldId: ID!): [ID!]!
  """
  Public LEGO inventory. `fieldIds` narrows to blocks carrying ANY of the given
  labels (OR, not AND) — the tab strip selects one at a time, and a block with
  two labels must appear under both.
  """
  publicBlocks(fieldIds: [ID!]): [RoadmapNode!]!
  """
  Ids of the roadmaps the caller has favourited. Empty for guests — they have
  no account to hold a list.
  """
  myFavoriteRoadmapIds: [ID!]!
  """Published discovery labels are public; CMS may request every status."""
  fields(includeUnpublished: Boolean = false): [Field!]!
  field(slug: String!): Field
  publicBlockGraph(id: ID!): RoadmapGraph
  myProgress: [RoadmapProgress!]!
  composition(ownerId: ID!, scope: CompositionScope = DRAFT): Composition!
  notionDoc(id: ID!): NotionDoc
  notionDocBySlug(slug: String!): NotionDoc
  notionChildren(parentDocumentId: ID!): [NotionDoc!]!
  notionTrash: [NotionDoc!]!
  notionSearch: [NotionDoc!]!
}

type Mutation {
  createRoadmap(input: CreateRoadmapInput!): Roadmap!
  updateRoadmap(id: ID!, input: UpdateRoadmapInput!): Roadmap!
  deleteRoadmap(id: ID!): Boolean!
  """
  Find-or-create by title. The admin picker creates labels inline, so a repeated
  title (case-insensitively) must return the EXISTING label rather than minting
  a duplicate "AI" / "ai" pair.
  """
  createField(input: CreateFieldInput!): Field!
  """Retitle in place — every node carrying the label follows automatically."""
  updateField(id: ID!, input: UpdateFieldInput!): Field!
  deleteField(id: ID!): Boolean!
  """Reorders all memberships of one Field without affecting other Fields."""
  reorderFieldMembership(fieldId: ID!, nodeIds: [ID!]!): Boolean!
  createNode(input: CreateNodeInput!): RoadmapNode!
  updateNode(id: ID!, input: UpdateNodeInput!): RoadmapNode!
  deleteNode(id: ID!): Boolean!
  moveNode(nodeId: ID!, roadmapId: ID!, positionX: Float!, positionY: Float!): RoadmapNode!
  saveRoadmap(roadmapId: ID!, nodes: [NodeInput!]!): Boolean!
  addCompositionMember(
    ownerId: ID!
    nodeId: ID!
    positionX: Float!
    positionY: Float!
    isRequired: Boolean = true
  ): Composition!
  moveCompositionMember(
    ownerId: ID!
    nodeId: ID!
    positionX: Float!
    positionY: Float!
  ): Boolean!
  removeCompositionMember(ownerId: ID!, nodeId: ID!): Composition!
  addCompositionEdge(
    ownerId: ID!
    sourceId: ID!
    targetId: ID!
    kind: EdgeKind!
  ): CompositionEdge!
  updateCompositionEdgeKind(
    ownerId: ID!
    edgeId: ID!
    kind: EdgeKind!
  ): CompositionEdge!
  removeCompositionEdge(ownerId: ID!, edgeId: ID!): Composition!
  replaceComposition(
    ownerId: ID!
    members: [CompositionMemberInput!]!
    edges: [CompositionEdgeInput!]!
  ): Composition!
  publishComposition(ownerId: ID!): Composition!
  setNodeStatus(nodeId: ID!, status: NodeStatus!): Boolean!
  """
  Opening content starts it. Never downgrades: a node already done stays done,
  and completion still needs the learner's explicit action.
  """
  markNodeOpened(nodeId: ID!): Boolean!
  """Add or remove a roadmap from the caller's favourites. Returns the new state."""
  setRoadmapFavorite(ownerNodeId: ID!, favorite: Boolean!): Boolean!
  createNotionDoc(input: CreateNotionDocInput!): NotionDoc!
  updateNotionDoc(input: UpdateNotionDocInput!): NotionDoc!
  archiveNotionDoc(id: ID!): Boolean!
  restoreNotionDoc(id: ID!): Boolean!
  removeNotionDoc(id: ID!): Boolean!
  moveNotionDoc(id: ID!, parentDocumentId: ID): NotionDoc!
  reorderNotionDocs(parentDocumentId: ID!, orderedIds: [ID!]!): Boolean!
  removeNotionIcon(id: ID!): NotionDoc!
  removeNotionCover(id: ID!): NotionDoc!
}

input CreateNotionDocInput {
  title: String
  parentDocumentId: ID
  slug: String
}

input UpdateNotionDocInput {
  id: ID!
  title: String
  content: String
  icon: String
  coverImage: String
  isPublished: Boolean
}

input CreateRoadmapInput {
  slug: String!
  title: String!
  description: String
  thumbnailUrl: String
  discoverability: Discoverability
  visibility: Visibility
  roleTags: [String!]
  dueDate: String
}

input UpdateRoadmapInput {
  title: String
  description: String
  thumbnailUrl: String
  publishStatus: PublishStatus
  discoverability: Discoverability
  visibility: Visibility
  roleTags: [String!]
  dueDate: String
}

input CreateFieldInput {
  title: String!
  slug: String
  description: String
  imageUrl: String
  publishStatus: PublishStatus
}

input UpdateFieldInput {
  title: String
  slug: String
  description: String
  imageUrl: String
  publishStatus: PublishStatus
  order: Int
}

input CreateNodeInput {
  roadmapId: ID!
  parentId: ID
  title: String!
  nodeType: NodeType!
  slug: String
  description: String
  notionPageId: String
  articleType: ArticleType
  jupyterUrl: String
  positionX: Float!
  positionY: Float!
  order: Int
  coverUrl: String
  level: Level
  visibility: Visibility
  tags: [String!]
  fieldIds: [ID!]
}

input UpdateNodeInput {
  title: String
  description: String
  articleType: ArticleType
  notionPageId: String
  jupyterUrl: String
  positionX: Float
  positionY: Float
  order: Int
  parentId: ID
  linkedRoadmapId: ID
  publishStatus: PublishStatus
  coverUrl: String
  level: Level
  visibility: Visibility
  """Replaces the whole tag list when present; omit to leave tags alone."""
  tags: [String!]
  """Replaces the whole label set when present; omit to leave labels alone."""
  fieldIds: [ID!]
}

input NodeInput {
  id: ID!
  parentId: ID
  positionX: Float!
  positionY: Float!
}

input CompositionMemberInput {
  nodeId: ID!
  x: Float!
  y: Float!
  isRequired: Boolean = true
}

input CompositionEdgeInput {
  sourceId: ID!
  targetId: ID!
  kind: EdgeKind!
}
